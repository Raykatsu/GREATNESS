kind = "web"
previewPath = "/"
title = "Hybrid Athletic Program"
version = "1.0.0"
id = "artifacts/hybrid-program"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24396

[services.development]
run = "pnpm --filter @workspace/hybrid-program run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hybrid-program", "run", "build" ]
publicDir = "artifacts/hybrid-program/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24396"
BASE_PATH = "/"
