name: Supabase (IA en ligne)

# Installe la base de données et la fonction « coach » sur Supabase, puis vérifie de bout en bout
# que Gemini répond. Active aussi les notifications (rappels de séance, défis entre amis) et la réception des
# mesures Apple Santé. Se lance tout seul quand le dossier supabase/ change sur main, ou à la main
# (onglet Actions → « Supabase (IA en ligne) » → Run workflow).
# Prérequis : le secret GitHub SUPABASE_ACCESS_TOKEN (voir SUPABASE.md, « Déploiement automatique »).

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_REF: kahzhwslhstsnkcdciyt
  FUNCTION_URL: https://kahzhwslhstsnkcdciyt.supabase.co/functions/v1/coach
  REMINDERS_URL: https://kahzhwslhstsnkcdciyt.supabase.co/functions/v1/reminders
  HEALTH_URL: https://kahzhwslhstsnkcdciyt.supabase.co/functions/v1/health
  # Clé publique du projet (déjà dans js/config.js), envoyée comme le fait l'app
  PUBLISHABLE_KEY: sb_publishable_QXGwpXit7dx-N2xEkcx2Zw_3V30TXwU

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Jeton Supabase présent ?
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning title=IA en ligne non déployée::Ajoute le secret SUPABASE_ACCESS_TOKEN (voir SUPABASE.md, « Déploiement automatique »)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ok == 'true'
        with:
          version: 2.120.0

      - name: Base de données (scripts SQL relançables)
        id: sql
        if: steps.token.outputs.ok == 'true'
        continue-on-error: true
        run: |
          for f in schema.sql 002_social.sql 003_push.sql 004_ai.sql 005_social_push.sql 006_water_push.sql 007_league_push.sql 008_health.sql 009_ai_models.sql 010_rest_timer.sql 011_account_delete.sql; do
            code=$(jq -Rs '{query: .}' "supabase/$f" | curl -sS -o out.json -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data-binary @-)
            echo "$f : HTTP $code"
            if [ "$code" -ge 300 ]; then head -c 600 out.json; echo; echo "::error::$f n'a pas pu être appliqué"; exit 1; fi
          done

      - name: Secret de diagnostic (temporaire)
        if: steps.token.outputs.ok == 'true'
        run: |
          DIAG=$(openssl rand -hex 24)
          echo "::add-mask::$DIAG"
          echo "DIAG=$DIAG" >> "$GITHUB_ENV"
          supabase secrets set "DIAG_TOKEN=$DIAG" --project-ref "$PROJECT_REF"

      - name: Déploiement de la fonction coach
        if: steps.token.outputs.ok == 'true'
        run: supabase functions deploy coach --project-ref "$PROJECT_REF" --no-verify-jwt --use-api

      - name: Vérifications de bout en bout
        if: steps.token.outputs.ok == 'true'
        run: |
          fail=0
          # La nouvelle version peut mettre quelques secondes à répondre
          for i in $(seq 1 20); do
            body=$(curl -sS --max-time 20 "$FUNCTION_URL" || true)
            case "$body" in *"fonction coach en ligne"*) break ;; esac
            sleep 3
          done
          echo "GET : $body"
          case "$body" in *"fonction coach en ligne"*) ;; *) echo "::error::la fonction ne répond pas"; fail=1 ;; esac

          # Vérification préalable du navigateur (CORS)
          cors=$(curl -sS --max-time 20 -o /dev/null -D - -X OPTIONS "$FUNCTION_URL" \
            -H "Origin: https://raykatsu.github.io" -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: apikey,content-type" | tr -d '\r' | grep -i '^access-control-allow-origin' || true)
          echo "CORS : $cors"
          [ -n "$cors" ] || { echo "::error::en-têtes CORS absents"; fail=1; }

          # Un faux jeton doit être refusé proprement (flux SSE de GREATNESS, pas une erreur de la plateforme)
          bad=$(curl -sS --max-time 30 -X POST "$FUNCTION_URL" -H "apikey: $PUBLISHABLE_KEY" -H "Content-Type: application/json" \
            -d '{"token":"x","messages":[{"role":"user","content":"test"}]}' || true)
          echo "Faux jeton : $bad"
          case "$bad" in *BAD_TOKEN*) ;; *) echo "::error::réponse inattendue au faux jeton"; fail=1 ;; esac

          # Diagnostic complet, une ligne par étape : clé Gemini, compteur, modèles disponibles,
          # vrai chemin du chat (flux + recherche Google) avec la durée de chaque essai, puis un essai par modèle
          echo "Diagnostic :"
          curl -sS -N --max-time 170 -X POST "$FUNCTION_URL" -H "apikey: $PUBLISHABLE_KEY" -H "x-diag-token: $DIAG" \
            -H "Content-Type: application/json" -d '{}' | grep --line-buffered -v '^[[:space:]]*$' | tee diag.txt || true
          [ "$(tail -n 1 diag.txt | jq -r .ok 2>/dev/null)" = "true" ] || { echo "::error::Gemini ne répond pas : voir le diagnostic ci-dessus"; fail=1; }
          exit $fail

      # Fonction « reminders » + planification toutes les 15 min (pg_cron, pg_net). Crée les clés VAPID si
      # besoin. Une clé aléatoire (CRON_KEY) réserve l'envoi à la planification.
      - name: Notifications (rappels et défis entre amis)
        if: always() && steps.token.outputs.ok == 'true'
        continue-on-error: true
        run: |
          names=$(supabase secrets list --project-ref "$PROJECT_REF" -o json 2>/dev/null | jq -r '.[].name' 2>/dev/null || true)
          [ -n "$names" ] || names=$(supabase secrets list --project-ref "$PROJECT_REF" 2>/dev/null | awk -F'|' 'NR > 2 { gsub(/ /, "", $1); print $1 }')
          has() { printf '%s\n' "$names" | grep -qx "$1"; }
          if ! has VAPID_PUBLIC_KEY || ! has VAPID_PRIVATE_KEY; then
            # pas encore de clés : on crée une paire ; la privée ne va que dans les secrets Supabase,
            # l'app lit la publique auprès de la fonction (GET)
            keys=$(node -e 'const c=require("crypto"),e=c.createECDH("prime256v1");e.generateKeys();const pad=(b,n)=>Buffer.concat([Buffer.alloc(Math.max(0,n-b.length)),b]);console.log(JSON.stringify({pub:pad(e.getPublicKey(),65).toString("base64url"),priv:pad(e.getPrivateKey(),32).toString("base64url")}))')
            pub=$(printf '%s' "$keys" | jq -r .pub); priv=$(printf '%s' "$keys" | jq -r .priv)
            echo "::add-mask::$priv"
            supabase secrets set "VAPID_PUBLIC_KEY=$pub" "VAPID_PRIVATE_KEY=$priv" --project-ref "$PROJECT_REF" > /dev/null
            echo "Nouvelle paire de clés VAPID créée. Clé publique : $pub"
          fi
          has VAPID_SUBJECT || supabase secrets set "VAPID_SUBJECT=https://raykatsu.github.io/GREATNESS/" --project-ref "$PROJECT_REF" > /dev/null
          CRON=$(openssl rand -hex 24)
          echo "::add-mask::$CRON"
          supabase secrets set "CRON_KEY=$CRON" --project-ref "$PROJECT_REF" > /dev/null
          supabase functions deploy reminders --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          sql="create extension if not exists pg_cron;
          create extension if not exists pg_net with schema extensions;
          select cron.schedule('greatness-reminders', '*/15 * * * *', \$job\$ select net.http_post(url := '$REMINDERS_URL', headers := jsonb_build_object('Content-Type', 'application/json', 'x-cron-key', '$CRON'), body := '{}'::jsonb, timeout_milliseconds := 25000) \$job\$);"
          code=$(jq -n --arg q "$sql" '{query: $q}' | curl -sS -o cron.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data-binary @-)
          echo "Planification toutes les 15 min : HTTP $code"
          if [ "$code" -ge 300 ]; then head -c 600 cron.json; echo; echo "::error::planification impossible"; exit 1; fi
          # essai : la fonction répond (et envoie ce qui serait dû à cet instant)
          for i in 1 2 3 4 5 6; do
            res=$(curl -sS --max-time 40 -X POST "$REMINDERS_URL" -H "x-cron-key: $CRON" -H "Content-Type: application/json" -d '{}' || true)
            case "$res" in *'"due"'*) break ;; esac
            sleep 5
          done
          echo "Essai de la fonction : $res"
          refused=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -X POST "$REMINDERS_URL" -H "Content-Type: application/json" -d '{}' || true)
          echo "Sans la clé de planification : HTTP $refused (403 attendu)"
          echo "Clé publique servie à l'app : $(curl -sS --max-time 20 "$REMINDERS_URL" | jq -r '.publicKey // "absente"' | cut -c1-16)…"
          case "$res" in *'"due"'*) ;; *) echo "::error::la fonction reminders ne répond pas"; exit 1 ;; esac
          # alerte de fin de repos (écran verrouillé) : un faux jeton doit être refusé par la base (010_rest_timer.sql)
          timer=$(curl -sS --max-time 20 -X POST "$REMINDERS_URL" -H "Content-Type: text/plain" \
            -d '{"token":"x","timer":{"id":"rest-verif1","endpoint":"https://push.invalid/x","in":5000}}' || true)
          echo "Alerte de fin de repos (faux jeton) : $timer"
          case "$timer" in *BAD_TOKEN*) ;; *) echo "::error::alerte de fin de repos : réponse inattendue"; exit 1 ;; esac

      # Fonction « health » : reçoit les mesures Apple Santé du Raccourci iOS (clé à part, voir 008_health.sql)
      - name: Fonction Apple Santé
        if: always() && steps.token.outputs.ok == 'true'
        continue-on-error: true
        run: |
          supabase functions deploy health --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          for i in $(seq 1 20); do
            body=$(curl -sS --max-time 20 "$HEALTH_URL" || true)
            case "$body" in *"fonction santé en ligne"*) break ;; esac
            sleep 3
          done
          echo "GET : $body"
          bad=$(curl -sS --max-time 20 "$HEALTH_URL?k=inconnu.cle&steps=10" || true)
          echo "Clé inconnue : $bad"
          case "$body" in *"fonction santé en ligne"*) ;; *) echo "::error::la fonction health ne répond pas"; exit 1 ;; esac
          case "$bad" in *BAD_KEY*) ;; *) echo "::error::réponse inattendue à une clé inconnue"; exit 1 ;; esac

      - name: Retrait du secret de diagnostic
        if: always() && steps.token.outputs.ok == 'true'
        run: supabase secrets unset DIAG_TOKEN --project-ref "$PROJECT_REF" --yes || true

      - name: Bilan de la base de données
        if: steps.token.outputs.ok == 'true' && steps.sql.outcome == 'failure'
        run: |
          echo "::error::Les scripts SQL n'ont pas pu être appliqués (voir l'étape « Base de données »)."
          exit 1
