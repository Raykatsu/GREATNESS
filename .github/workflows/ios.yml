name: App iPhone (TestFlight)

# Construit l'app iPhone (Capacitor, dossier app-store/) à partir du site et l'envoie sur TestFlight, prête pour
# l'App Store, sans Mac : tout se passe sur un Mac de GitHub. Avec l'extension GreatnessWidgets (widget « Séance du
# jour », repos dans la Dynamic Island) : les identifiants de l'app et de l'extension sont réglés dans le projet. Se lance à la main : onglet Actions →
# « App iPhone (TestFlight) » → Run workflow. Sans les secrets Apple (voir APPSTORE.md), seule une construction de
# vérification est faite (simulateur, sans signature) : elle prouve que le projet compile.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version affiché sur l'App Store (ex. 1.0.0)"
        default: "1.0.0"
        required: true

permissions:
  contents: read

concurrency:
  group: ios
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 75
    # bash avec pipefail : une erreur de xcodebuild n'est pas masquée par « | tail »
    defaults:
      run:
        shell: bash
    env:
      BUNDLE_ID: io.github.raykatsu.greatness
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Xcode le plus récent (pas de bêta)
        run: |
          x=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta' | sort -V | tail -1)
          echo "Xcode choisi : $x"
          sudo xcode-select -s "$x"
          xcodebuild -version

      - name: Projet iPhone (site, réglages, icônes)
        working-directory: app-store
        run: |
          npm ci --no-audit --no-fund
          node build-web.mjs
          npx cap add ios
          node ios-setup.mjs
          # widget « Séance du jour » et repos en Live Activity : l'extension et le pont natif (gemme xcodeproj)
          ruby -e 'require "xcodeproj"' 2>/dev/null || gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document
          ruby ios-widgets.rb
          npx @capacitor/assets generate --ios --iconBackgroundColor '#06060b' --splashBackgroundColor '#09090d' --splashBackgroundColorDark '#09090d'
          npx cap sync ios

      - name: Secrets Apple présents ?
        id: apple
        run: |
          if [ -n "$TEAM_ID" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets Apple absents (APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8) : construction de vérification seulement. Voir APPSTORE.md."
          fi

      - name: Construction de vérification (simulateur, sans signature)
        if: steps.apple.outputs.ok != 'true'
        working-directory: app-store/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -n 40
          echo "Le projet iPhone compile. Ajoute les secrets Apple pour l'envoyer sur TestFlight."

      - name: Archive signée et envoi sur TestFlight
        if: steps.apple.outputs.ok == 'true'
        working-directory: app-store/ios/App
        run: |
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          # la clé .p8 telle quelle (texte « BEGIN PRIVATE KEY ») ou encodée en base64
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then printf '%s\n' "$ASC_KEY_P8" > "$key"; else printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key"; fi
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" "${auth[@]}" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" archive | tail -n 60
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" "${auth[@]}" | tail -n 40
          rm -f "$key"
          echo "Version $VERSION (build ${{ github.run_number }}) envoyée : elle arrive dans TestFlight après le traitement d'Apple (10 à 30 min)."
