name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérification de la syntaxe
        run: for f in js/*.js sw.js; do node --check "$f"; done
      - name: Tests (moteur, coach, planning, SQL des comptes et des amis)
        run: npm test
